services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      FIXTURES_DIR: /fixtures
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./fixtures:/fixtures:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

